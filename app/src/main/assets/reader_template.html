<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10263F"><title>LAPIS Reader</title><style>:root{--navy:#10263F;--lapis:#173F73;--glacier:#347B8B;--ice:#F3F8FA;--text:#283640;--muted:#60717d;--gold:#C8B58A;--goldDeep:#806533;--wine:#7A4148}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;background:#e6edf1;color:var(--text)}button,select,input{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(16,38,63,.97);color:white;padding:10px 10px 8px}.row{display:flex;align-items:center;gap:7px}.brand{font:700 15px Georgia,serif;white-space:nowrap}.mode{flex:1;min-width:0;background:#173F73;color:#fff;border:1px solid #ffffff2b;border-radius:9px;padding:8px}.icon{border:0;background:#ffffff16;color:#fff;border-radius:9px;padding:8px 10px}.status{margin-top:6px;color:#d7e3e8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search{display:none;gap:6px;padding-top:7px}.search.on{display:flex}.search input{flex:1;min-width:0;border:0;border-radius:8px;padding:9px}.search button{border:0;border-radius:8px;background:var(--gold);color:var(--navy)}.stage{padding:10px 7px 100px;display:flex;justify-content:center}.card{width:100%;max-width:760px;border-radius:18px;overflow:hidden;box-shadow:0 12px 34px #10263f24}.front{min-height:500px;background:#10263F url('front.jpg') center/cover no-repeat;color:#fff8eb;display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;padding:16px 17px;font-size:13px}.front .head{background:#0a22404a}.counter{color:#d9c89f;font-family:Georgia,serif}.frontMain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 23px 54px}.prompt{font:700 50px/1.2 Georgia,"Times New Roman",serif;text-shadow:0 2px 9px #0008;overflow-wrap:anywhere}.prompt.long{font-size:28px;line-height:1.48}.hint{margin-top:20px;font-size:13px;color:#e6f0f2;background:#10263f63;border-radius:999px;padding:7px 11px}.bigPlay{width:108px;height:108px;border-radius:50%;border:1px solid var(--gold);background:#10263fb8;color:white;font-size:34px}.back{min-height:500px;background:#F3F8FA url('ice_mist_back.jpg') top center/100% auto repeat-y}.back .head{background:#f4f8fa55;border-bottom:1px solid #c8b58a9e;color:var(--navy)}.backMain{padding:14px 11px 26px}.title{font:700 35px/1.2 Georgia,serif;color:var(--lapis);margin:2px 0 5px}.meta{font-size:14px;color:#52616D}.ipa{color:var(--glacier);font:19px Georgia,serif;margin:6px 0}.panel{margin-top:13px;padding:12px 11px;border-left:3px solid var(--lapis);border-radius:0 10px 10px 0;background:#e5eef44d}.panel h3{font-size:14px;margin:0 0 8px;color:var(--navy)}.panel.recall{border-color:#4A9CAC;background:#daedf04d}.panel.memory{border-color:var(--gold);background:#ebf3f64d}.panel.memory h3,.panel.coll h3,.panel.comp h3{color:var(--goldDeep)}.panel.zh{border-color:#4A9CAC}.panel.coll{border-color:var(--goldDeep)}.panel.comp{border-color:var(--gold)}.panel.warn{border-color:var(--wine);background:#7a41480e}.panel p{margin:7px 0}.sense{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #10263f17}.sense:last-child{border:0}.sense-number,.catalogue-pos,.memory-image strong,.memory-family strong,.tip{color:var(--goldDeep)}.definition,.expression,.translation strong,.memory-morpheme,.family-item b{color:var(--lapis)}.example,.catalogue-example{color:var(--glacier)}.sense-tag,.usage{color:#6d592e;background:#c8b58a24;border:1px solid #c8b58a47;border-radius:999px;padding:1px 6px;font-size:11px}.memory-part{display:inline-block;background:var(--lapis);color:white;border-radius:999px;padding:4px 8px;margin:0 5px 5px 0}.zh-example,.note,.compare-text,.memory-hint,.memory-source{color:#52616D;font-size:14px}.smallPlay{border:0;border-radius:999px;background:#dcecef;color:var(--glacier);padding:7px 10px;margin-left:7px}.controls{position:fixed;z-index:30;left:0;right:0;bottom:0;background:#f6f8f9f7;padding:9px 9px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px #10263f18}.ctrl{max-width:760px;margin:auto;display:grid;grid-template-columns:54px 1fr 54px;gap:8px}.ctrl button{border:0;border-radius:11px;min-height:48px}.prev,.next{background:#e1e9ed;color:var(--lapis);font-size:20px}.flip{background:var(--lapis);color:white;font-weight:700}.toast{position:fixed;z-index:50;left:50%;bottom:115px;transform:translateX(-50%);background:var(--navy);color:white;padding:8px 12px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}@media(max-width:430px){.front{min-height:470px}.prompt{font-size:46px}.prompt.long{font-size:26px}.title{font-size:32px}}</style></head><body><header class="top"><div class="row"><div class="brand">LAPIS Reader</div><select id="mode" class="mode"><option value="recognize">英文识义</option><option value="define">英文释义</option><option value="produce">中文产出</option><option value="audio">听音识词</option></select><button id="searchBtn" class="icon">⌕</button></div><div id="status" class="status"></div><div id="searchBox" class="search"><input id="q" placeholder="搜索英文或中文"><button id="go">搜索</button></div></header><main class="stage"><div id="card" class="card"></div></main><div class="controls"><div class="ctrl"><button id="prev" class="prev">‹</button><button id="flip" class="flip">显示答案</button><button id="next" class="next">›</button></div></div><div id="toast" class="toast"></div><script>const NOTES=__NOTES_JSON__;const $=x=>document.getElementById(x);let idx=+(localStorage.lapisIdx||0),mode=localStorage.lapisMode||'recognize',back=false;idx=Math.max(0,Math.min(idx,NOTES.length-1));function plain(s){let d=document.createElement('div');d.innerHTML=s||'';return(d.textContent||'').trim()}function save(){localStorage.lapisIdx=idx;localStorage.lapisMode=mode}function note(){return NOTES[idx]}function label(){return{recognize:'英文识义',define:'英文释义',produce:'中文产出',audio:'听音识词'}[mode]}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}function play(n=note()){if(!n.audio)return toast('本卡没有音频');new Audio('media/'+encodeURIComponent(n.audio)).play().catch(()=>toast('音频未能播放'))}function panel(c,t,b){return plain(b)?`<section class="panel ${c}"><h3>${t}</h3><div>${b}</div></section>`:''}function front(n){if(mode==='audio')return`<div class="front"><div class="head"><span>${label()}</span><span class="counter">${idx+1} / ${NOTES.length}</span></div><div class="frontMain"><button class="bigPlay" onclick="play()">▶</button><div class="hint">只听音频，先说出单词和核心意思</div></div></div>`;let p=mode==='recognize'?n.w:mode==='define'?n.promptEN:n.promptZH,h=mode==='recognize'?'回忆全部已收录义项':mode==='define'?'根据英文释义说出目标词':'根据中文提示说出英文';return`<div class="front"><div class="head"><span>${label()}</span><span class="counter">${idx+1} / ${NOTES.length}</span></div><div class="frontMain"><div class="prompt${plain(p).length>60?' long':''}">${p||''}</div><div class="hint">${h}</div></div></div>`}function answer(n){return`<div class="back"><div class="head"><span>${label()} · 答案</span><span class="counter">${idx+1} / ${NOTES.length}</span></div><div class="backMain"><div style="display:flex;align-items:center;flex-wrap:wrap"><h1 class="title">${n.w}</h1>${n.audio?'<button class="smallPlay" onclick="play()">▶ 原音频</button>':''}</div>${n.ipa?`<div class="ipa">${n.ipa}</div>`:''}${n.pos||n.grammar?`<div class="meta">${n.pos||''}${n.pos&&n.grammar?' · ':''}${n.grammar||''}</div>`:''}${panel('recall','本卡回忆（全部义项）',n.recall)}${panel('memory','词根拆解 · 联想记忆',n.root)}${panel('','英文释义与完整例句',n.eng)}${panel('zh','中文释义与例句译文',n.zh)}${panel('warn','用法提醒',n.usage)}${panel('coll','常用搭配与用法示例',n.coll)}${panel('comp','词义、词形与词族对照',n.comp)}${n.pron?`<details class="panel"><summary style="color:#806533">发音与词典核验说明</summary>${n.pron}</details>`:''}</div></div>`}function render(){let n=note();$('card').innerHTML=back?answer(n):front(n);$('flip').textContent=back?'返回正面':'显示答案';$('mode').value=mode;$('status').textContent=`${idx+1} / ${NOTES.length} · ${plain(n.w)}`;save()}function nav(d){idx=(idx+d+NOTES.length)%NOTES.length;back=false;render()}function find(){let q=$('q').value.trim().toLowerCase();if(!q)return;for(let k=0;k<NOTES.length;k++){let i=(idx+1+k)%NOTES.length,n=NOTES[i],s=(plain(n.w)+' '+plain(n.promptZH)+' '+plain(n.recall)+' '+plain(n.zh)).toLowerCase();if(s.includes(q)){idx=i;back=false;$('searchBox').classList.remove('on');return render()}}toast('没有找到')}$('prev').onclick=()=>nav(-1);$('next').onclick=()=>nav(1);$('flip').onclick=()=>{back=!back;render()};$('mode').onchange=e=>{mode=e.target.value;back=false;render()};$('searchBtn').onclick=()=>$('searchBox').classList.toggle('on');$('go').onclick=find;$('q').onkeydown=e=>{if(e.key==='Enter')find()};let sx=0,sy=0;$('card').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});$('card').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4)nav(dx<0?1:-1)},{passive:true});render();</script></body></html>
