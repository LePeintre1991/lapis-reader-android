<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10263F"><title>LAPIS Reader</title><style>
:root{--navy:#10263F;--lapis:#173F73;--glacier:#347B8B;--ice:#F3F8FA;--text:#283640;--muted:#60717d;--gold:#C8B58A;--goldDeep:#806533;--wine:#7A4148}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;background:#e6edf1;color:var(--text)}button,select,input{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(16,38,63,.97);color:white;padding:10px 10px 8px}.row{display:flex;align-items:center;gap:7px}.brand{font:700 15px Georgia,serif;white-space:nowrap}.mode{flex:1;min-width:0;background:#173F73;color:#fff;border:1px solid #ffffff2b;border-radius:9px;padding:8px}.icon{border:0;background:#ffffff16;color:#fff;border-radius:9px;padding:8px 10px}.status{margin-top:6px;color:#d7e3e8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search{display:none;gap:6px;padding-top:7px}.search.on{display:flex}.search input{flex:1;min-width:0;border:0;border-radius:8px;padding:9px}.search button{border:0;border-radius:8px;background:var(--gold);color:var(--navy)}.stage{padding:10px 7px 112px;display:flex;justify-content:center}.card{width:100%;max-width:760px;border-radius:18px;overflow:hidden;box-shadow:0 12px 34px #10263f24;touch-action:pan-y}.front{min-height:500px;background:#10263F url('front.jpg') center/cover no-repeat;color:#fff8eb;display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;padding:16px 17px;font-size:13px}.front .head{background:#0a22404a}.counter{color:#d9c89f;font-family:Georgia,serif}.frontMain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 23px 54px}.prompt{font:700 50px/1.2 Georgia,"Times New Roman",serif;text-shadow:0 2px 9px #0008;overflow-wrap:anywhere}.prompt.long{font-size:28px;line-height:1.48}.hint{margin-top:20px;font-size:13px;color:#e6f0f2;background:#10263f63;border-radius:999px;padding:7px 11px}.bigPlay{width:108px;height:108px;border-radius:50%;border:1px solid var(--gold);background:#10263fb8;color:white;font-size:34px}.back{min-height:500px;background:#F3F8FA url('ice_mist_back.jpg') top center/100% auto repeat-y}.back .head{background:#f4f8fa55;border-bottom:1px solid #c8b58a9e;color:var(--navy)}.backMain{padding:14px 11px 26px}.title{font:700 35px/1.2 Georgia,serif;color:var(--lapis);margin:2px 0 5px}.meta{font-size:14px;color:#52616D}.ipa{color:var(--glacier);font:19px Georgia,serif;margin:6px 0}.panel{margin-top:13px;padding:12px 11px;border-left:3px solid var(--lapis);border-radius:0 10px 10px 0;background:#e5eef44d}.panel h3{font-size:14px;margin:0 0 8px;color:var(--navy)}.panel.recall{border-color:#4A9CAC;background:#daedf04d}.panel.memory{border-color:var(--gold);background:#ebf3f64d}.panel.memory h3,.panel.coll h3,.panel.comp h3{color:var(--goldDeep)}.panel.zh{border-color:#4A9CAC}.panel.coll{border-color:var(--goldDeep)}.panel.comp{border-color:var(--gold)}.panel.warn{border-color:var(--wine);background:#7a41480e}.panel p{margin:7px 0}.sense{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #10263f17}.sense:last-child{border:0}.sense-number,.catalogue-pos,.memory-image strong,.memory-family strong,.tip{color:var(--goldDeep)}.definition,.expression,.translation strong,.memory-morpheme,.family-item b{color:var(--lapis)}.example,.catalogue-example{color:var(--glacier)}.sense-tag,.usage{color:#6d592e;background:#c8b58a24;border:1px solid #c8b58a47;border-radius:999px;padding:1px 6px;font-size:11px}.memory-part{display:inline-block;background:var(--lapis);color:white;border-radius:999px;padding:4px 8px;margin:0 5px 5px 0}.zh-example,.note,.compare-text,.memory-hint,.memory-source{color:#52616D;font-size:14px}.smallPlay{border:0;border-radius:999px;background:#dcecef;color:var(--glacier);padding:7px 10px;margin-left:7px}.ratings{display:none;position:fixed;z-index:30;left:0;right:0;bottom:0;background:#f6f8f9f5;padding:9px 9px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px #10263f18}.ratings.on{display:block}.ratingGrid{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rate{border:0;border-radius:12px;min-height:56px;font-weight:800;line-height:1.15}.rate small{display:block;font-size:11px;margin-top:4px;font-weight:600;opacity:.78}.again{background:#ead7dc;color:#69333e}.hard{background:#eadfca;color:#654d20}.easy{background:#d7e9ed;color:#225968}.done{max-width:760px;width:100%;padding:42px 22px;background:#f3f8fa;border-radius:18px;text-align:center;box-shadow:0 12px 34px #10263f20}.done h2{font:700 29px Georgia,serif;color:var(--navy);margin:0 0 12px}.done p{color:var(--muted);line-height:1.7}.done button{border:0;border-radius:10px;background:var(--lapis);color:white;padding:10px 16px}.toast{position:fixed;z-index:50;left:50%;bottom:88px;transform:translateX(-50%);background:var(--navy);color:white;padding:8px 12px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}.modal{display:none;position:fixed;z-index:80;inset:0;background:#10263f70;padding:20px;align-items:center;justify-content:center}.modal.on{display:flex}.sheet{width:min(420px,100%);background:#f5f9fa;border-radius:16px;padding:20px;box-shadow:0 20px 50px #10263f40}.sheet h3{margin:0 0 14px;color:var(--navy)}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #c7d3d9;border-radius:9px}.sheetBtns{display:flex;gap:8px;margin-top:17px}.sheetBtns button{flex:1;border:0;border-radius:9px;padding:10px}.cancel{background:#e5ecef;color:var(--navy)}.saveBtn{background:var(--lapis);color:white}@media(max-width:430px){.front{min-height:470px}.prompt{font-size:46px}.prompt.long{font-size:26px}.title{font-size:32px}.rate{min-height:54px}}
</style></head><body><header class="top"><div class="row"><div class="brand">LAPIS Reader</div><select id="mode" class="mode"><option value="recognize">英文识义</option><option value="define">英文释义</option><option value="produce">中文产出</option><option value="audio">听音识词</option></select><button id="searchBtn" class="icon">⌕</button><button id="settingsBtn" class="icon">⚙</button></div><div id="status" class="status"></div><div id="searchBox" class="search"><input id="q" placeholder="搜索英文或中文"><button id="go">搜索</button></div></header><main class="stage"><div id="card" class="card"></div></main><div id="ratings" class="ratings"><div class="ratingGrid"><button id="again" class="rate again">Again<small id="againEta">10 分钟</small></button><button id="hard" class="rate hard">Hard<small id="hardEta">1 天</small></button><button id="easy" class="rate easy">Easy<small id="easyEta">3 天</small></button></div></div><div id="settings" class="modal"><div class="sheet"><h3>每日学习设置</h3><div class="field"><label>每天新词</label><input id="newLimit" type="number" min="1" max="500"></div><div class="field"><label>每天最多复习</label><input id="reviewLimit" type="number" min="1" max="2000"></div><div class="sheetBtns"><button id="cancelSettings" class="cancel">取消</button><button id="saveSettings" class="saveBtn">保存</button></div></div></div><div id="toast" class="toast"></div><script>
const NOTES=__NOTES_JSON__,DAY=86400000,MIN=60000,$=x=>document.getElementById(x),INDEX={};NOTES.forEach((n,i)=>INDEX[String(n.id)]=i);
let mode=localStorage.lapisMode||'recognize',back=false,idx=0,finished=false;let PREFS=load('lapisPrefsV13',{newLimit:40,reviewLimit:120});let SRS=load('lapisSrsV13',{});let TODAY=todayStats();
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function store(k,v){localStorage.setItem(k,JSON.stringify(v))}function dateKey(){let d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+x}function todayStats(){let s=load('lapisTodayV13',{}),d=dateKey();if(s.date!==d)s={date:d,newIds:[],reviewIds:[],again:0,hard:0,easy:0};return s}function persist(){localStorage.lapisMode=mode;store('lapisPrefsV13',PREFS);store('lapisSrsV13',SRS);store('lapisTodayV13',TODAY)}function plain(s){let d=document.createElement('div');d.innerHTML=s||'';return(d.textContent||'').trim()}function note(){return NOTES[idx]}function idOf(n=note()){return String(n.id)}function label(){return{recognize:'英文识义',define:'英文释义',produce:'中文产出',audio:'听音识词'}[mode]}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1500)}function play(n=note()){if(!n.audio)return toast('本卡没有音频');let a=new Audio('media/'+encodeURIComponent(n.audio));a.play().catch(()=>toast('音频未能播放'))}function panel(c,t,b){return plain(b)?`<section class="panel ${c}"><h3>${t}</h3><div>${b}</div></section>`:''}
function front(n){if(mode==='audio')return`<div class="front"><div class="head"><span>${label()}</span><span class="counter">${plain(n.w)}</span></div><div class="frontMain"><button class="bigPlay" onclick="play()">▶</button><div class="hint">只听音频，先说出单词和核心意思</div></div></div>`;let p=mode==='recognize'?n.w:mode==='define'?n.promptEN:n.promptZH,h=mode==='recognize'?'回忆全部已收录义项':mode==='define'?'根据英文释义说出目标词':'根据中文提示说出英文';return`<div class="front"><div class="head"><span>${label()}</span><span class="counter">轻点翻面</span></div><div class="frontMain"><div class="prompt${plain(p).length>60?' long':''}">${p||''}</div><div class="hint">${h}</div></div></div>`}
function answer(n){return`<div class="back"><div class="head"><span>${label()} · 答案</span><span class="counter">评分后自动下一张</span></div><div class="backMain"><div style="display:flex;align-items:center;flex-wrap:wrap"><h1 class="title">${n.w}</h1>${n.audio?'<button class="smallPlay" onclick="play()">▶ 原音频</button>':''}</div>${n.ipa?`<div class="ipa">${n.ipa}</div>`:''}${n.pos||n.grammar?`<div class="meta">${n.pos||''}${n.pos&&n.grammar?' · ':''}${n.grammar||''}</div>`:''}${panel('recall','本卡回忆（全部义项）',n.recall)}${panel('memory','词根拆解 · 联想记忆',n.root)}${panel('','英文释义与完整例句',n.eng)}${panel('zh','中文释义与例句译文',n.zh)}${panel('warn','用法提醒',n.usage)}${panel('coll','常用搭配与用法示例',n.coll)}${panel('comp','词义、词形与词族对照',n.comp)}${n.pron?`<details class="panel"><summary style="color:#806533">发音与词典核验说明</summary>${n.pron}</details>`:''}</div></div>`}
function dueLearning(now=Date.now()){let best=-1,bestDue=Infinity;for(let i=0;i<NOTES.length;i++){let s=SRS[String(NOTES[i].id)];if(s&&s.state==='learning'&&s.due<=now&&s.due<bestDue){best=i;bestDue=s.due}}return best}function nextDueReview(now=Date.now()){if(TODAY.reviewIds.length>=PREFS.reviewLimit)return-1;let seen=new Set(TODAY.reviewIds),best=-1,bestDue=Infinity;for(let i=0;i<NOTES.length;i++){let id=String(NOTES[i].id),s=SRS[id];if(s&&s.state==='review'&&s.due<=now&&!seen.has(id)&&s.due<bestDue){best=i;bestDue=s.due}}return best}function nextNew(){if(TODAY.newIds.length>=PREFS.newLimit)return-1;for(let i=0;i<NOTES.length;i++)if(!SRS[String(NOTES[i].id)])return i;return-1}function chooseNext(){TODAY=todayStats();let i=dueLearning();if(i<0)i=nextDueReview();if(i<0)i=nextNew();if(i<0){finished=true;back=false;renderDone();return false}idx=i;finished=false;back=false;render();return true}
function countDue(){let now=Date.now(),n=0;for(let i=0;i<NOTES.length;i++){let s=SRS[String(NOTES[i].id)];if(s&&s.state==='review'&&s.due<=now&&!TODAY.reviewIds.includes(String(NOTES[i].id)))n++}return n}function nextLearningTime(){let t=Infinity;for(let k in SRS){let s=SRS[k];if(s.state==='learning'&&s.due>Date.now()&&s.due<t)t=s.due}return t}
function renderDone(){let next=nextLearningTime(),msg=next<Infinity?'有 Again 卡将在 '+new Date(next).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' 再次到期。':'今天的计划已经完成。';$('card').innerHTML=`<div class="done"><h2>今日完成</h2><p>新词 ${TODAY.newIds.length}/${PREFS.newLimit}<br>复习 ${TODAY.reviewIds.length}/${PREFS.reviewLimit}<br>${msg}</p><button onclick="chooseNext()">检查是否有新到期卡</button></div>`;$('ratings').classList.remove('on');$('status').textContent=`今日 · 新 ${TODAY.newIds.length}/${PREFS.newLimit} · 复习 ${TODAY.reviewIds.length}/${PREFS.reviewLimit}`;persist()}
function intervalPreview(kind){let s=SRS[idOf()]||null;if(kind==='again')return'10 分钟';if(kind==='hard'){let d=!s||s.state==='learning'||(s.interval||0)<1?1:Math.max(1,Math.round(s.interval*1.45));return d+' 天'}let e=s&&s.ease||2.5,d=!s||s.state==='learning'||(s.interval||0)<1?3:Math.max(Math.round((s.interval||1)+1),Math.round((s.interval||1)*e*1.15));return d+' 天'}function updateRatings(){$('againEta').textContent=intervalPreview('again');$('hardEta').textContent=intervalPreview('hard');$('easyEta').textContent=intervalPreview('easy')}
function render(){if(finished)return renderDone();let n=note();$('card').innerHTML=back?answer(n):front(n);$('ratings').classList.toggle('on',back);$('mode').value=mode;let due=countDue();$('status').textContent=`新 ${TODAY.newIds.length}/${PREFS.newLimit} · 复习 ${TODAY.reviewIds.length}/${PREFS.reviewLimit} · 到期 ${due} · ${plain(n.w)}`;if(back)updateRatings();persist()}
function reveal(){if(finished||back)return;back=true;render();play()}function rate(kind){if(!back||finished)return;let n=note(),id=idOf(n),s=SRS[id],wasNew=!s,now=Date.now();if(!s)s={state:'new',due:0,interval:0,ease:2.5,reps:0,lapses:0,last:0};if(wasNew){if(!TODAY.newIds.includes(id))TODAY.newIds.push(id)}else if(!TODAY.newIds.includes(id)&&!TODAY.reviewIds.includes(id)){TODAY.reviewIds.push(id)}if(kind==='again'){s.state='learning';s.due=now+10*MIN;s.interval=Math.max(0,(s.interval||0)*.35);s.ease=Math.max(1.3,(s.ease||2.5)-.2);s.lapses=(s.lapses||0)+1;TODAY.again++}else if(kind==='hard'){s.interval=s.state==='new'||s.state==='learning'||(s.interval||0)<1?1:Math.max(1,(s.interval||1)*1.45);s.state='review';s.due=now+s.interval*DAY;s.ease=Math.max(1.3,(s.ease||2.5)-.05);TODAY.hard++}else{s.interval=s.state==='new'||s.state==='learning'||(s.interval||0)<1?3:Math.max((s.interval||1)+1,(s.interval||1)*(s.ease||2.5)*1.15);s.state='review';s.due=now+s.interval*DAY;s.ease=Math.min(3.2,(s.ease||2.5)+.1);TODAY.easy++}s.reps=(s.reps||0)+1;s.last=now;SRS[id]=s;persist();chooseNext()}
function find(){let q=$('q').value.trim().toLowerCase();if(!q)return;for(let k=0;k<NOTES.length;k++){let i=(idx+1+k)%NOTES.length,n=NOTES[i],s=(plain(n.w)+' '+plain(n.promptZH)+' '+plain(n.recall)+' '+plain(n.zh)).toLowerCase();if(s.includes(q)){idx=i;finished=false;back=false;$('searchBox').classList.remove('on');return render()}}toast('没有找到')}
$('again').onclick=()=>rate('again');$('hard').onclick=()=>rate('hard');$('easy').onclick=()=>rate('easy');$('mode').onchange=e=>{mode=e.target.value;back=false;render()};$('searchBtn').onclick=()=>$('searchBox').classList.toggle('on');$('go').onclick=find;$('q').onkeydown=e=>{if(e.key==='Enter')find()};$('settingsBtn').onclick=()=>{$('newLimit').value=PREFS.newLimit;$('reviewLimit').value=PREFS.reviewLimit;$('settings').classList.add('on')};$('cancelSettings').onclick=()=>$('settings').classList.remove('on');$('saveSettings').onclick=()=>{let a=Math.max(1,Math.min(500,+$('newLimit').value||40)),b=Math.max(1,Math.min(2000,+$('reviewLimit').value||120));PREFS={newLimit:a,reviewLimit:b};persist();$('settings').classList.remove('on');toast('每日计划已更新');chooseNext()};let sx=0,sy=0,skipTapUntil=0;$('card').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});$('card').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.5){skipTapUntil=Date.now()+450;if(dx>0){for(let i=Math.max(0,idx-1);i>=0;i--){idx=i;finished=false;back=false;render();break}}else chooseNext()}},{passive:true});$('card').addEventListener('click',e=>{if(Date.now()<skipTapUntil||finished)return;if(e.target.closest('button,a,input,select,textarea,audio,summary,details'))return;if(!back)reveal();else toast('请选择 Again / Hard / Easy')});chooseNext();
</script></body></html>
